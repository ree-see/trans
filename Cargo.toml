[package]
name = "trans"
version = "0.5.0"
edition = "2021"
authors = ["Jackson <jackson@reesee.dev>"]
description = "Transcribe YouTube, TikTok, and Twitch videos to text with speaker diarization"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ree-see/trans"

[[bin]]
name = "trans"
path = "src/main.rs"

[lib]
name = "trans"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
once_cell = "1"
md-5 = "0.10"
hex = "0.4"
dirs = "5"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
